server:
  port: 8080

spring:
  application:
    name: ecommerce-backend
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:ecommerce;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema.sql

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

assistant:
  api:
    key: ${DEEPSEEK_API_KEY:}
    url: https://api.deepseek.com/chat/completions
    model: deepseek-v4-flash
