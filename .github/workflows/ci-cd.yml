name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: 后端单元测试 (Spring Boot)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 编译并运行测试
        working-directory: backend
        run: mvn -B --no-transfer-progress verify

  frontend-build:
    name: 前端构建 (Vue 3)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 构建（Pages 项目子路径）
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  e2e-test:
    name: E2E 测试 (Playwright)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 安装 Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: 启动后端 (8080)
        working-directory: backend
        run: |
          nohup mvn -B --no-transfer-progress spring-boot:run > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/backend.pid"

      - name: 启动前端 (5173)
        working-directory: frontend
        run: |
          nohup npm run dev -- --host 127.0.0.1 > "$RUNNER_TEMP/frontend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/frontend.pid"

      - name: 等待服务就绪
        run: |
          for i in $(seq 1 90); do
            backend_code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/products || true)
            frontend_code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5173/ || true)
            if [ "$backend_code" = "200" ] && [ "$frontend_code" = "200" ]; then
              echo "前后端服务已就绪"
              exit 0
            fi
            sleep 2
          done
          echo '--- backend.log ---'
          tail -n 100 "$RUNNER_TEMP/backend.log" || true
          echo '--- frontend.log ---'
          tail -n 100 "$RUNNER_TEMP/frontend.log" || true
          exit 1

      - name: 运行 E2E 测试
        working-directory: frontend
        env:
          NODE_PATH: ${{ github.workspace }}/frontend/node_modules
        run: npx playwright test --config=../docs/superpowers/tests/playwright.config.js --retries=1

      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: docs/superpowers/tests/playwright-report
          if-no-files-found: ignore

      - name: 停止本地服务
        if: always()
        run: |
          kill $(cat "$RUNNER_TEMP/backend.pid" "$RUNNER_TEMP/frontend.pid" 2>/dev/null) 2>/dev/null || true

  deploy-pages:
    name: 部署前端到 GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-test, frontend-build, e2e-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: 下载前端构建产物
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 发布到 Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 部署验收
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
        run: |
          set -e
          echo "验收目标: $PAGE_URL"

          code="000"
          for i in $(seq 1 60); do
            code=$(curl -s -o /tmp/qy-index.html -w '%{http_code}' "$PAGE_URL" || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          [ "$code" = "200" ] || { echo "站点不可访问: HTTP $code"; exit 1; }
          echo "首页可访问: HTTP 200"

          asset=$(grep -o 'src="[^"]*\.js"' /tmp/qy-index.html | head -1 | sed 's/src="//;s/"$//')
          [ -n "$asset" ] || { echo "首页未引用 JS 资源"; exit 1; }
          asset_code=$(curl -s -o /dev/null -w '%{http_code}' "${SITE_ORIGIN}${asset}" || true)
          [ "$asset_code" = "200" ] || { echo "静态资源不可访问: $asset HTTP $asset_code"; exit 1; }
          echo "静态资源可访问: $asset HTTP 200"

          fallback_code=$(curl -s -o /tmp/qy-deep.html -w '%{http_code}' "${PAGE_URL}products" || true)
          grep -q 'location.replace' /tmp/qy-deep.html || { echo "SPA 深链接回退失效"; exit 1; }
          echo "SPA 深链接回退生效 (HTTP $fallback_code, 404.html 已接管)"

          {
            echo '## 部署验收结果'
            echo ''
            echo '- 站点: ['"$PAGE_URL"']('"$PAGE_URL"')'
            echo '- 首页 HTTP 200'
            echo "- 静态资源 HTTP 200: \`$asset\`"
            echo "- SPA 深链接回退: 生效"
            echo '- 结论: **验收通过**'
          } >> "$GITHUB_STEP_SUMMARY"
