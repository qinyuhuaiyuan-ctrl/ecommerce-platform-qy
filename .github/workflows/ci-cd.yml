name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  staging-package:
    name: 打包 staging 应用
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [backend-test, frontend-build, e2e-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: frontend
        run: npm ci && npm run build
      - name: Package Vue and Spring Boot together
        run: |
          mkdir -p backend/src/main/resources/static bundle
          cp -R frontend/dist/. backend/src/main/resources/static/
          printf '%s' "$GITHUB_SHA" > backend/src/main/resources/static/build-sha.txt
          mvn -B -f backend/pom.xml package -DskipTests
          cp backend/target/*.jar bundle/app.jar
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: staging-${{ github.sha }}
          path: bundle/app.jar
  deploy-staging:
    name: 部署 Windows 测试环境
    needs: staging-package
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, xcode-staging]
    timeout-minutes: 15
    concurrency:
      group: ecommerce-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: ${{ vars.STAGING_URL || 'http://localhost:18080' }}
    permissions:
      contents: read
      actions: read
      deployments: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 下载本次流水线构建包
        uses: actions/download-artifact@v4
        with:
          name: staging-${{ github.sha }}
          path: staging-bundle
      - name: 启动应用并验证版本和健康状态
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: ./ops/deploy-staging.ps1 -Jar ./staging-bundle/app.jar -Sha $env:DEPLOY_SHA -Java "$env:JAVA_HOME/bin/java.exe"
      - name: 上传部署日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ~/AppData/Local/ecommerce-qy-staging/logs/*
          if-no-files-found: ignore
  backend-test:
    name: 后端单元测试 (Spring Boot)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 编译并运行测试
        working-directory: backend
        run: mvn -B --no-transfer-progress verify

  frontend-build:
    name: 前端构建 (Vue 3)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 前端构建校验
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  e2e-test:
    name: E2E 测试 (Playwright)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 安装 Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: 启动后端 (8080)
        working-directory: backend
        run: |
          nohup mvn -B --no-transfer-progress spring-boot:run > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/backend.pid"

      - name: 启动前端 (5173)
        working-directory: frontend
        run: |
          nohup npm run dev -- --host 127.0.0.1 > "$RUNNER_TEMP/frontend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/frontend.pid"

      - name: 等待服务就绪
        run: |
          for i in $(seq 1 90); do
            backend_code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/products || true)
            frontend_code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5173/ || true)
            if [ "$backend_code" = "200" ] && [ "$frontend_code" = "200" ]; then
              echo "前后端服务已就绪"
              exit 0
            fi
            sleep 2
          done
          echo '--- backend.log ---'
          tail -n 100 "$RUNNER_TEMP/backend.log" || true
          echo '--- frontend.log ---'
          tail -n 100 "$RUNNER_TEMP/frontend.log" || true
          exit 1

      - name: 运行 E2E 测试
        working-directory: frontend
        env:
          NODE_PATH: ${{ github.workspace }}/frontend/node_modules
        run: npx playwright test --config=../docs/superpowers/tests/playwright.config.js --retries=1

      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: docs/superpowers/tests/playwright-report
          if-no-files-found: ignore

      - name: 停止本地服务
        if: always()
        run: |
          kill $(cat "$RUNNER_TEMP/backend.pid" "$RUNNER_TEMP/frontend.pid" 2>/dev/null) 2>/dev/null || true
